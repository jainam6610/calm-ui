version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: ["dependencies", "ci"]

  - package-ecosystem: gradle
    directory: "/StudentLauncher"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    ignore:
      # AGP 9 and core-ktx 1.16+ must move together with Gradle and Kotlin in one
      # tested change. See issue #16. Remove these ignores when that lands.
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.tools.build:gradle"
        update-types: ["version-update:semver-major"]
      - dependency-name: "androidx.core:core-ktx"
        versions: [">= 1.16.0"]
      # Compose BOM upgrades are deliberate, tested changes, not drive-by bumps.
      - dependency-name: "androidx.compose:compose-bom"
        update-types: ["version-update:semver-major"]
