version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: ["dependencies", "ci"]

  - package-ecosystem: gradle
    directory: "/StudentLauncher"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    ignore:
      # The Android toolchain has to move as one tested change: Gradle 9.6+ removes
      # internal APIs that AGP 8.x still uses, AGP 9 needs Gradle 9, core-ktx 1.16+
      # needs AGP 9.1, and Kotlin 2.4 needs a matching Compose compiler. See issue #16.
      # Remove these ignores when that upgrade lands.
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.application"
      - dependency-name: "com.android.tools.build:gradle"
      - dependency-name: "org.jetbrains.kotlin.android"
        versions: [">= 2.2.0"]
      - dependency-name: "org.jetbrains.kotlin.plugin.compose"
        versions: [">= 2.2.0"]
      - dependency-name: "androidx.core:core-ktx"
        versions: [">= 1.16.0"]
      # Compose BOM upgrades are deliberate, tested changes, not drive-by bumps.
      - dependency-name: "androidx.compose:compose-bom"
        update-types: ["version-update:semver-major"]
